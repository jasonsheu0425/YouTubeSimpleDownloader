[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-simple-downloader"
version = "0.11.0"
description = "Simple YouTube audio/video downloader for public videos and playlists."
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.10.1",
    "yt-dlp==2026.8.19",
    "imageio-ffmpeg==0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytsimpledownloader = ["assets/app_icon.ico"]

name: YouTube Upstream Metadata Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-metadata:
    name: YouTube upstream metadata
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Extract public video metadata
        env:
          YOUTUBE_UPSTREAM_SMOKE_VIDEO_ID: ${{ secrets.YOUTUBE_UPSTREAM_SMOKE_VIDEO_ID }}
        run: python scripts/youtube_upstream_smoke.py

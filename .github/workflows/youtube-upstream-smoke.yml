name: YouTube Upstream Metadata Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-metadata:
    name: YouTube upstream metadata
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/bootstrap.lock
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify dependency locks
        run: python scripts/check_dependency_locks.py
      - name: Extract public video metadata
        env:
          YOUTUBE_UPSTREAM_SMOKE_VIDEO_ID: ${{ secrets.YOUTUBE_UPSTREAM_SMOKE_VIDEO_ID }}
        run: python scripts/youtube_upstream_smoke.py

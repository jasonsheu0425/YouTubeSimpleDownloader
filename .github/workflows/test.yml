name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Prepare FFmpeg 8.1.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials"
          $policyPath = Join-Path $env:GITHUB_WORKSPACE "security\artifact_hashes.json"
          $policy = (Get-Content -Raw -LiteralPath $policyPath | ConvertFrom-Json).artifacts.ffmpeg_windows_x64
          $expectedArchiveHash = [string]$policy.archive_sha256
          $expectedVersion = [string]$policy.version

          Invoke-WebRequest `
            -Uri ([string]$policy.source_url) `
            -OutFile $archive

          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($archiveHash -ne $expectedArchiveHash) {
            throw "FFmpeg archive SHA-256 mismatch. Expected $expectedArchiveHash, got $archiveHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $ffmpegSource = Get-ChildItem -LiteralPath $extractDir -Recurse -Filter "ffmpeg.exe" -File |
            Where-Object { $_.FullName -match "[\\/]bin[\\/]ffmpeg\.exe$" } |
            Select-Object -First 1
          if (-not $ffmpegSource) {
            throw "FFmpeg executable was not found in the verified archive."
          }

          python scripts/check_ffmpeg_artifact.py $ffmpegSource.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted FFmpeg artifact verification failed with exit code $LASTEXITCODE."
          }

          $targetDir = Join-Path $env:GITHUB_WORKSPACE "ffmpeg"
          $target = Join-Path $targetDir "ffmpeg.exe"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -LiteralPath $ffmpegSource.FullName -Destination $target -Force

          python scripts/check_ffmpeg_artifact.py $target
          if ($LASTEXITCODE -ne 0) {
            throw "Copied FFmpeg artifact verification failed with exit code $LASTEXITCODE."
          }

          $versionOutput = & $target -version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg.exe -version failed with exit code $LASTEXITCODE."
          }
          $versionLine = [string]($versionOutput | Select-Object -First 1)
          $versionPattern = "^ffmpeg version $([regex]::Escape($expectedVersion))(?:-|\s)"
          if ($versionLine -notmatch $versionPattern) {
            throw "Unexpected FFmpeg version: $versionLine"
          }
          $versionOutput
      - name: Run local regression tests
        run: python -m pytest
      - name: Compile source and tests
        run: python -m compileall src tests

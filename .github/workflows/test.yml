name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .
      - name: Prepare FFmpeg 8.1.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials"
          $expectedArchiveHash = "DB580001CAA24AC104C8CB856CD113A87B0A443F7BDF47D8C12B1D740584A2EC"
          $expectedFfmpegHash = "1326DDE4C84FF1F96FE6B8916C5BED29E163E9B5DCCF995F6F3DB069D143EC5E"

          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile $archive

          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($archiveHash -ne $expectedArchiveHash) {
            throw "FFmpeg archive SHA-256 mismatch. Expected $expectedArchiveHash, got $archiveHash."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $ffmpegSource = Get-ChildItem -LiteralPath $extractDir -Recurse -Filter "ffmpeg.exe" -File |
            Where-Object { $_.FullName -match "[\\/]bin[\\/]ffmpeg\.exe$" } |
            Select-Object -First 1
          if (-not $ffmpegSource) {
            throw "FFmpeg executable was not found in the verified archive."
          }

          $sourceHash = (Get-FileHash -LiteralPath $ffmpegSource.FullName -Algorithm SHA256).Hash
          if ($sourceHash -ne $expectedFfmpegHash) {
            throw "ffmpeg.exe SHA-256 mismatch. Expected $expectedFfmpegHash, got $sourceHash."
          }

          $targetDir = Join-Path $env:GITHUB_WORKSPACE "ffmpeg"
          $target = Join-Path $targetDir "ffmpeg.exe"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -LiteralPath $ffmpegSource.FullName -Destination $target -Force

          $targetHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          if ($targetHash -ne $expectedFfmpegHash) {
            throw "Copied ffmpeg.exe SHA-256 mismatch. Expected $expectedFfmpegHash, got $targetHash."
          }

          $versionOutput = & $target -version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg.exe -version failed with exit code $LASTEXITCODE."
          }
          $versionLine = [string]($versionOutput | Select-Object -First 1)
          if ($versionLine -notmatch "^ffmpeg version 8\.1\.2(?:-|\s)") {
            throw "Unexpected FFmpeg version: $versionLine"
          }
          $versionOutput
      - name: Run local regression tests
        run: python -m pytest
      - name: Compile source and tests
        run: python -m compileall src tests
